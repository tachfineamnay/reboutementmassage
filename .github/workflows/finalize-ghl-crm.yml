name: Finalize GHL CRM hardening

on:
  push:
    branches:
      - sprint/ghl-crm-cleanup
    paths:
      - .github/workflows/finalize-ghl-crm.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint/ghl-crm-cleanup
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Apply targeted hardening patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          lead_path = "src/lib/lead-service.ts"

          replace_once(
              lead_path,
              '''  let landingPageId = nullableText(data.landingPageId);
          	  let destinationId = nullableText(data.destinationId);
          	  let offerId = nullableText(data.offerId);

          	  if (!landingPageId && data.pageUrl) {'''.replace("\t", ""),
              '''  let landingPageId = nullableText(data.landingPageId);
            let destinationId = nullableText(data.destinationId);
            let offerId = nullableText(data.offerId);

            if (!destinationId && data.formKind === "body_reset_fix") {
              try {
                const destination = await prisma.destination.findUnique({
                  where: { slug: "cdmx" },
                  select: { id: true, defaultOfferId: true },
                });
                if (destination) {
                  destinationId = destination.id;
                  offerId = offerId ?? destination.defaultOfferId;
                }
              } catch (error) {
                console.error("CDMX static routing resolution failed", error);
              }
            }

            if (!landingPageId && data.pageUrl) {'''
          )

          # Main request: verify required fields and workflow configuration before trigger tags.
          replace_once(
              lead_path,
              '''    await ghlFetch(ghlConfig, `/contacts/${contactId}/tags`, {
                body: { tags },
              });

              if (customFields.missingRequiredFields.length > 0) {''',
              '''    if (customFields.missingRequiredFields.length > 0) {'''
          )

          replace_once(
              lead_path,
              '''      });
            }

            await ghlFetch(ghlConfig, `/contacts/${contactId}/notes`, {''',
              '''      });
            }

            const requiresWorkflow = tags.includes(GHL_SYSTEM_TAGS.sourceSitePremium);
            if (requiresWorkflow && !ghlConfig.workflowId) {
              const message = "GHL_WORKFLOW_NOT_CONFIGURED";
              await updateLeadSubmission(leadSubmissionId, {
                status: "FAILED",
                ghlContactId: contactId,
                errorMessage: message,
              });
              return Response.json({
                ok: true,
                ghlStatus: "partial",
                warnings: [...customFields.warnings, message],
                notification: notification.status,
              });
            }

            await ghlFetch(ghlConfig, `/contacts/${contactId}/tags`, {
              body: { tags },
            });

            await ghlFetch(ghlConfig, `/contacts/${contactId}/notes`, {'''
          )

          replace_once(
              lead_path,
              '''    if (ghlConfig.workflowId) {
                await optionalGhlStep("add contact to workflow", () =>
                  ghlFetch(ghlConfig, `/contacts/${contactId}/workflow/${ghlConfig.workflowId}`, {
                    body: payload.selectedDateTime
                      ? { eventStartTime: payload.selectedDateTime }
                      : {},
                  })
                );
              }

              await updateLeadSubmission(leadSubmissionId, {''',
              '''    if (requiresWorkflow) {
                try {
                  await ghlFetch(ghlConfig, `/contacts/${contactId}/workflow/${ghlConfig.workflowId}`, {
                    body: payload.selectedDateTime
                      ? { eventStartTime: payload.selectedDateTime }
                      : {},
                  });
                } catch (error) {
                  const detail = error instanceof Error ? error.message.slice(0, 3500) : "unknown error";
                  const message = `GHL_WORKFLOW_ENROLLMENT_FAILED: ${detail}`;
                  await updateLeadSubmission(leadSubmissionId, {
                    status: "FAILED",
                    ghlContactId: contactId,
                    errorMessage: message,
                  });
                  return Response.json({
                    ok: true,
                    ghlStatus: "partial",
                    warnings: [...customFields.warnings, message],
                    notification: notification.status,
                  });
                }
              } else if (ghlConfig.workflowId) {
                await optionalGhlStep("add contact to workflow", () =>
                  ghlFetch(ghlConfig, `/contacts/${contactId}/workflow/${ghlConfig.workflowId}`, {
                    body: payload.selectedDateTime
                      ? { eventStartTime: payload.selectedDateTime }
                      : {},
                  })
                );
              }

              await updateLeadSubmission(leadSubmissionId, {'''
          )

          # Admin retry: same ordering and mandatory workflow contract.
          replace_once(
              lead_path,
              '''    await ghlFetch(ghlConfig, `/contacts/${contactId}/tags`, {
                body: { tags },
              });

              if (customFields.missingRequiredFields.length > 0) {''',
              '''    if (customFields.missingRequiredFields.length > 0) {'''
          )

          replace_once(
              lead_path,
              '''      return { ok: false, error: err };
            }

            await ghlFetch(ghlConfig, `/contacts/${contactId}/notes`, {''',
              '''      return { ok: false, error: err };
            }

            const requiresWorkflow = tags.includes(GHL_SYSTEM_TAGS.sourceSitePremium);
            if (requiresWorkflow && !ghlConfig.workflowId) {
              const err = "GHL_WORKFLOW_NOT_CONFIGURED";
              await updateLeadSubmission(leadId, {
                status: "FAILED",
                ghlContactId: contactId,
                errorMessage: err,
              });
              return { ok: false, error: err };
            }

            await ghlFetch(ghlConfig, `/contacts/${contactId}/tags`, {
              body: { tags },
            });

            await ghlFetch(ghlConfig, `/contacts/${contactId}/notes`, {'''
          )

          replace_once(
              lead_path,
              '''    if (ghlConfig.workflowId) {
                await optionalGhlStep("add contact to workflow", () =>
                  ghlFetch(ghlConfig, `/contacts/${contactId}/workflow/${ghlConfig.workflowId}`, {
                    body: payload.selectedDateTime
                      ? { eventStartTime: payload.selectedDateTime }
                      : {},
                  })
                );
              }

              await updateLeadSubmission(leadId, {''',
              '''    if (requiresWorkflow) {
                try {
                  await ghlFetch(ghlConfig, `/contacts/${contactId}/workflow/${ghlConfig.workflowId}`, {
                    body: payload.selectedDateTime
                      ? { eventStartTime: payload.selectedDateTime }
                      : {},
                  });
                } catch (error) {
                  const detail = error instanceof Error ? error.message.slice(0, 3500) : "unknown error";
                  const err = `GHL_WORKFLOW_ENROLLMENT_FAILED: ${detail}`;
                  await updateLeadSubmission(leadId, {
                    status: "FAILED",
                    ghlContactId: contactId,
                    errorMessage: err,
                  });
                  return { ok: false, error: err };
                }
              } else if (ghlConfig.workflowId) {
                await optionalGhlStep("add contact to workflow", () =>
                  ghlFetch(ghlConfig, `/contacts/${contactId}/workflow/${ghlConfig.workflowId}`, {
                    body: payload.selectedDateTime
                      ? { eventStartTime: payload.selectedDateTime }
                      : {},
                  })
                );
              }

              await updateLeadSubmission(leadId, {'''
          )

          # Clarify that GHL_FIELD_* variables accept field IDs, not field keys.
          env_path = Path(".env.example")
          env_text = env_path.read_text(encoding="utf-8")
          env_text = env_text.replace(
              "# Existing GHL contact custom fields (IDs or stable keys only; leave empty to use temporary visible-name lookup)",
              "# Existing GHL contact custom field IDs only (leave empty to use temporary visible-name lookup)",
          )
          env_path.write_text(env_text, encoding="utf-8")

          docs_path = Path("docs/crm-reference-for-tajfine.md")
          docs_text = docs_path.read_text(encoding="utf-8")
          docs_text = docs_text.replace("by ID or stable key", "by GHL field ID")
          docs_text = docs_text.replace("IDs or stable keys", "GHL field IDs")
          docs_path.write_text(docs_text, encoding="utf-8")

          test_path = "src/lib/lead-service.test.ts"
          replace_once(
              test_path,
              '''  landingPage: {
                findFirst: vi.fn(),
              },
              crmRoutingRule:''',
              '''  landingPage: {
                findFirst: vi.fn(),
              },
              destination: {
                findUnique: vi.fn(),
              },
              crmRoutingRule:'''
          )
          replace_once(
              test_path,
              '''import { handleLeadRequest } from "@/lib/lead-service";''',
              '''import { handleLeadRequest, retryLeadSubmissionGhl } from "@/lib/lead-service";'''
          )
          replace_once(
              test_path,
              '''  prismaMock.landingPage.findFirst.mockResolvedValue(null);
            });''',
              '''  prismaMock.landingPage.findFirst.mockResolvedValue(null);
              prismaMock.destination.findUnique.mockResolvedValue(null);
            });'''
          )
          replace_once(
              test_path,
              '''    expect(prismaMock.leadSubmission.update).toHaveBeenCalledWith(
                expect.objectContaining({
                  data: expect.objectContaining({
                    status: "FAILED",
                    ghlContactId: "contact_1",
                    errorMessage: expect.stringContaining("GHL_REQUIRED_CUSTOM_FIELDS_MISSING"),
                  }),
                })
              );
            });''',
              '''    expect(prismaMock.leadSubmission.update).toHaveBeenCalledWith(
                expect.objectContaining({
                  data: expect.objectContaining({
                    status: "FAILED",
                    ghlContactId: "contact_1",
                    errorMessage: expect.stringContaining("GHL_REQUIRED_CUSTOM_FIELDS_MISSING"),
                  }),
                })
              );
              expect(fetchMock.mock.calls.map(([url]) => String(url)).join("\\n")).not.toContain("/tags");
              expect(fetchMock.mock.calls.map(([url]) => String(url)).join("\\n")).not.toContain("/workflow/");
            });'''
          )

          test_file = Path(test_path)
          test_text = test_file.read_text(encoding="utf-8")
          marker = "\n});\n"
          if not test_text.endswith(marker):
              raise SystemExit("Unexpected lead-service.test.ts ending")
          extra_tests = r'''

            it("returns partial without trigger tags when the site workflow is missing", async () => {
              delete process.env.GHL_WORKFLOW_ID;
              const fetchMock = mockSuccessfulFetch();
              vi.stubGlobal("fetch", fetchMock);

              const response = await handleLeadRequest(makeRequest({ eventId: "evt_no_workflow" }));
              const body = await response.json();

              expect(body.ghlStatus).toBe("partial");
              expect(body.warnings).toContain("GHL_WORKFLOW_NOT_CONFIGURED");
              const urls = fetchMock.mock.calls.map(([url]) => String(url)).join("\n");
              expect(urls).not.toContain("/tags");
              expect(urls).not.toContain("/workflow/");
              expect(prismaMock.leadSubmission.update).toHaveBeenCalledWith(
                expect.objectContaining({
                  data: expect.objectContaining({
                    status: "FAILED",
                    ghlContactId: "contact_1",
                    errorMessage: "GHL_WORKFLOW_NOT_CONFIGURED",
                  }),
                })
              );
            });

            it("returns partial when mandatory workflow enrollment fails", async () => {
              const fetchMock = vi.fn(async (url: RequestInfo | URL) => {
                const href = String(url);
                if (href.includes("/customFields")) {
                  return Response.json({
                    customFields: [
                      { id: "field_intention", name: "Intention", model: "contact" },
                      { id: "field_main_objective", name: "Main Objective", model: "contact" },
                      { id: "field_language", name: "Form Language", model: "contact" },
                    ],
                  });
                }
                if (href.includes("/contacts/upsert")) {
                  return Response.json({ contact: { id: "contact_1" } });
                }
                if (href.includes("/workflow/")) {
                  return new Response("workflow unavailable", { status: 503 });
                }
                return Response.json({});
              });
              vi.stubGlobal("fetch", fetchMock);

              const response = await handleLeadRequest(makeRequest({ eventId: "evt_workflow_failure" }));
              const body = await response.json();

              expect(body.ghlStatus).toBe("partial");
              expect(body.warnings).toEqual(
                expect.arrayContaining([expect.stringContaining("GHL_WORKFLOW_ENROLLMENT_FAILED")])
              );
              expect(prismaMock.leadSubmission.update).toHaveBeenCalledWith(
                expect.objectContaining({
                  data: expect.objectContaining({
                    status: "FAILED",
                    ghlContactId: "contact_1",
                    errorMessage: expect.stringContaining("GHL_WORKFLOW_ENROLLMENT_FAILED"),
                  }),
                })
              );
            });

            it("marks the site lead sent only after successful workflow enrollment", async () => {
              const fetchMock = mockSuccessfulFetch();
              vi.stubGlobal("fetch", fetchMock);

              const response = await handleLeadRequest(makeRequest({ eventId: "evt_workflow_success" }));
              const body = await response.json();
              const urls = fetchMock.mock.calls.map(([url]) => String(url));

              expect(body.ghlStatus).toBe("sent");
              expect(urls.some((url) => url.includes("/workflow/workflow_1"))).toBe(true);
              expect(prismaMock.leadSubmission.update).toHaveBeenCalledWith(
                expect.objectContaining({
                  data: expect.objectContaining({ status: "SENT_TO_GHL", ghlContactId: "contact_1" }),
                })
              );
            });

            it("routes Body Reset Fix through CDMX without a dynamic ES landing", async () => {
              prismaMock.destination.findUnique.mockResolvedValue({
                id: "destination_cdmx",
                defaultOfferId: "offer_cdmx",
              });
              prismaMock.offer.findUnique.mockResolvedValue({ type: "FOUNDER_SESSION" });
              prismaMock.crmRoutingRule.findMany.mockResolvedValue([
                {
                  id: "cdmx-crm-seed",
                  destinationId: "destination_cdmx",
                  locale: null,
                  offerType: "FOUNDER_SESSION",
                  source: null,
                  intent: null,
                  leadSegment: "b2c_premium",
                  tags: ["geo_country_mexique", "geo_city_mexico_city", "campaign_private_sessions"],
                  customFields: {},
                  priority: 10,
                  status: "ACTIVE",
                  ghlWorkflowId: "workflow_cdmx",
                  ghlPipelineId: null,
                  ghlPipelineStageId: null,
                  ghlAssignedUserId: null,
                },
              ]);
              const fetchMock = vi.fn(async (url: RequestInfo | URL) => {
                const href = String(url);
                if (href.includes("/customFields")) {
                  return Response.json({
                    customFields: [
                      { id: "field_intention", name: "Intention", model: "contact" },
                      { id: "field_main_objective", name: "Main Objective", model: "contact" },
                      { id: "field_pre_session_notes", name: "Pre-Session Notes", model: "contact" },
                      { id: "field_session_location", name: "Session Location Preference", model: "contact" },
                      { id: "field_current_location", name: "Current Location", model: "contact" },
                      { id: "field_language", name: "Form Language", model: "contact" },
                    ],
                  });
                }
                if (href.includes("/contacts/upsert")) {
                  return Response.json({ contact: { id: "contact_1" } });
                }
                return Response.json({});
              });
              vi.stubGlobal("fetch", fetchMock);

              const response = await handleLeadRequest(
                makeBodyResetFixRequest({
                  eventId: "evt_cdmx_static",
                  pageUrl: "https://example.com/es/reset-corporal-frances-cdmx",
                  landingPageId: null,
                  destinationId: null,
                  offerId: null,
                })
              );
              const body = await response.json();

              expect(body.ghlStatus).toBe("sent");
              expect(prismaMock.destination.findUnique).toHaveBeenCalledWith({
                where: { slug: "cdmx" },
                select: { id: true, defaultOfferId: true },
              });
              expect(prismaMock.leadSubmission.create).toHaveBeenCalledWith(
                expect.objectContaining({
                  data: expect.objectContaining({
                    destinationId: "destination_cdmx",
                    offerId: "offer_cdmx",
                    tags: expect.arrayContaining([
                      "source-site-premium",
                      "intent_private_session",
                      "lang_es",
                      "geo_country_mexique",
                      "geo_city_mexico_city",
                      "campaign_private_sessions",
                    ]),
                  }),
                })
              );
              const tagCall = fetchMock.mock.calls.find(([url]) => String(url).includes("/tags"));
              const tagBody = JSON.parse((tagCall?.[1] as RequestInit).body as string);
              expect(tagBody.tags).toEqual(
                expect.arrayContaining([
                  "source-site-premium",
                  "intent_private_session",
                  "lang_es",
                  "geo_country_mexique",
                  "geo_city_mexico_city",
                  "campaign_private_sessions",
                ])
              );
              expect(fetchMock.mock.calls.map(([url]) => String(url)).join("\n")).not.toContain("/opportunities/");
            });

            it("applies the mandatory workflow contract during admin retry", async () => {
              delete process.env.GHL_WORKFLOW_ID;
              prismaMock.leadSubmission.findUnique.mockResolvedValue({
                id: "lead_retry",
                firstName: "Ana",
                contact: "+525633003042",
                type: "Training",
                context: "Je veux me former.",
                locale: "FR",
                selectedDayLabel: null,
                selectedTime: null,
                selectedAt: null,
                timezone: "Europe/Paris",
                pageUrl: "https://example.com/fr",
                eventId: "evt_retry",
                landingPageId: null,
                destinationId: null,
                offerId: null,
                source: null,
                medium: null,
                campaign: null,
                content: null,
                creativeAngle: null,
                ctaLocation: null,
                utm: {},
                branchData: { trainingGoal: "Intégrer à ma pratique" },
                companyName: null,
                jobTitle: null,
                propertyType: null,
                destination: null,
                leadSegment: "b2c_premium",
                intent: "training",
                preferredChannel: "ghl",
                routedToUrl: null,
                urgency: null,
                needType: null,
                volumePotential: null,
                participantCount: null,
                currentLocation: "Paris",
              });
              const fetchMock = mockSuccessfulFetch();
              vi.stubGlobal("fetch", fetchMock);

              const result = await retryLeadSubmissionGhl("lead_retry");
              const urls = fetchMock.mock.calls.map(([url]) => String(url)).join("\n");

              expect(result.ok).toBe(false);
              expect(result.error).toBe("GHL_WORKFLOW_NOT_CONFIGURED");
              expect(urls).not.toContain("/tags");
              expect(urls).not.toContain("/workflow/");
            });
          '''
          test_file.write_text(test_text[:-len(marker)] + extra_tests + marker, encoding="utf-8")
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and validate Prisma
        run: |
          pnpm exec prisma generate
          pnpm exec prisma validate

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Commit validated correction
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-ghl-crm.yml
          git add .env.example docs/crm-reference-for-tajfine.md src/lib/lead-service.ts src/lib/lead-service.test.ts
          git commit -m "fix(crm): require workflow and decouple CDMX static routing"
          git push origin HEAD:sprint/ghl-crm-cleanup
